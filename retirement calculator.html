<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retirement runway — will your EPF carry you through retirement?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #EDF2ED; font-family: 'Inter', system-ui, sans-serif; color: #1C2B27; }
  input[type=number] { font-family: 'IBM Plex Mono', monospace; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/jsx-source" id="app-source">
const { useState, useEffect, useRef } = React;

const DEFAULTS = {
  currentAge: 30,
  retirementAge: 60,
  lifeExpectancy: 80,
  epfBalance: 45000,
  monthlySalary: 6000,
  salaryIncrement: 3,
  epfEmployeeRate: 11,
  epfEmployerRate: 12,
  epfVoluntary: 0,
  epfDividendRate: 5.5,
  otherSavings: 15000,
  monthlyOtherSavings: 500,
  otherReturnRate: 6,
  monthlyExpenses: 4000,
  retirementExpenseRatio: 70,
  inflationRate: 3,
};

const STEPS = [
  { id: 1, label: 'Retirement age', hint: 'When you plan to stop working' },
  { id: 2, label: 'EPF pot', hint: 'Your provident fund savings' },
  { id: 3, label: 'Other savings', hint: 'Everything outside EPF' },
  { id: 4, label: 'Expenses', hint: 'What retirement will cost' },
];

const EPF_DIVIDEND_HISTORY = [
  { year: 2018, rate: 6.15 },
  { year: 2019, rate: 5.45 },
  { year: 2020, rate: 5.2 },
  { year: 2021, rate: 6.1 },
  { year: 2022, rate: 5.35 },
  { year: 2023, rate: 5.5 },
  { year: 2024, rate: 6.3 },
  { year: 2025, rate: 6.15 },
];

const STORAGE_KEY = 'retirement-plan';

function fmt(n) {
  if (!isFinite(n)) return 'RM 0';
  return 'RM ' + Math.round(n).toLocaleString('en-MY');
}

function fmtCompact(n) {
  if (!isFinite(n)) return 'RM 0';
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n < 0 ? '-' : '') + 'RM ' + (abs / 1000000).toFixed(2) + 'M';
  if (abs >= 1000) return (n < 0 ? '-' : '') + 'RM ' + (abs / 1000).toFixed(1) + 'k';
  return fmt(n);
}

function computeProjection(d) {
  const yearsToRetirement = Math.max(d.retirementAge - d.currentAge, 0);
  const yearsInRetirement = Math.max(d.lifeExpectancy - d.retirementAge, 0);

  // Statutory contributions follow salary, which rises by the yearly increment.
  // Voluntary top-ups stay at the fixed amount entered.
  const annualEPFContributionInYear = (year) =>
    d.monthlySalary * Math.pow(1 + d.salaryIncrement / 100, year - 1) *
      ((d.epfEmployeeRate + d.epfEmployerRate) / 100) * 12 +
    d.epfVoluntary * 12;
  const annualOtherContribution = d.monthlyOtherSavings * 12;

  let epfBal = d.epfBalance;
  let otherBal = d.otherSavings;
  const points = [{ age: d.currentAge, total: epfBal + otherBal, phase: 'saving' }];

  for (let y = 1; y <= yearsToRetirement; y++) {
    epfBal = epfBal * (1 + d.epfDividendRate / 100) + annualEPFContributionInYear(y);
    otherBal = otherBal * (1 + d.otherReturnRate / 100) + annualOtherContribution;
    points.push({ age: d.currentAge + y, total: epfBal + otherBal, phase: 'saving' });
  }

  const totalAtRetirement = epfBal + otherBal;
  const monthlyExpenseAtRetirement =
    d.monthlyExpenses * (d.retirementExpenseRatio / 100) * Math.pow(1 + d.inflationRate / 100, yearsToRetirement);
  const annualExpenseAtRetirement = monthlyExpenseAtRetirement * 12;

  // During retirement, EPF and other savings keep earning their own rates —
  // withdrawals are drawn proportionally from each pot's current balance.
  let epfBalRet = epfBal;
  let otherBalRet = otherBal;
  let runOutAge = null;
  for (let y = 1; y <= yearsInRetirement; y++) {
    epfBalRet = epfBalRet * (1 + d.epfDividendRate / 100);
    otherBalRet = otherBalRet * (1 + d.otherReturnRate / 100);
    const pool = epfBalRet + otherBalRet;
    // spending keeps rising with inflation every year of retirement
    const expenseThisYear = annualExpenseAtRetirement * Math.pow(1 + d.inflationRate / 100, y - 1);
    if (pool > 0) {
      const epfShare = epfBalRet / pool;
      epfBalRet -= expenseThisYear * epfShare;
      otherBalRet -= expenseThisYear * (1 - epfShare);
    }
    const age = d.retirementAge + y;
    const total = epfBalRet + otherBalRet;
    if (total <= 0 && runOutAge === null) {
      runOutAge = age;
      points.push({ age, total: 0, phase: 'retirement' });
      break;
    }
    points.push({ age, total, phase: 'retirement' });
  }
  const remaining = epfBalRet + otherBalRet;

  // Required pot: present value of a fixed annual withdrawal, earning a blended
  // rate (weighted by how the pot splits between EPF and other savings at retirement).
  const blendedRate = totalAtRetirement > 0 ? (epfBal * d.epfDividendRate + otherBal * d.otherReturnRate) / totalAtRetirement / 100 : 0;
  // Withdrawals grow with inflation, so this is a growing annuity.
  const infl = d.inflationRate / 100;
  const requiredPot =
    Math.abs(blendedRate - infl) < 1e-9
      ? (annualExpenseAtRetirement * yearsInRetirement) / (1 + blendedRate)
      : (annualExpenseAtRetirement * (1 - Math.pow((1 + infl) / (1 + blendedRate), yearsInRetirement))) / (blendedRate - infl);

  const gap = totalAtRetirement - requiredPot;

  return {
    yearsToRetirement, yearsInRetirement,
    epfAtRetirement: epfBal, otherAtRetirement: otherBal,
    totalAtRetirement, monthlyExpenseAtRetirement, requiredPot, gap,
    points, runOutAge,
  };
}

function NumberField({ label, suffix, prefix, value, onChange, min = 0, max, step = 1, info }) {
  return (
    <label style={{ display: 'block', marginBottom: '16px' }}>
      <span style={{ display: 'flex', alignItems: 'center', fontSize: '14px', marginBottom: '6px', color: '#5C6B65' }}>
        {label}
        {info && <InfoPopover>{info}</InfoPopover>}
      </span>
      <div style={{ display: 'flex', alignItems: 'center', borderRadius: '8px', overflow: 'hidden', border: '1px solid #D3DBD4', background: '#FFFFFF' }}>
        {prefix && (
          <span style={{ paddingLeft: 12, paddingRight: 4, fontSize: 14, fontWeight: 500, color: '#164B44', fontFamily: 'IBM Plex Mono, monospace' }}>
            {prefix}
          </span>
        )}
        <input
          type="number"
          value={value}
          min={min}
          max={max}
          step={step}
          onChange={(e) => onChange(e.target.value === '' ? 0 : parseFloat(e.target.value))}
          style={{ width: '100%', padding: '10px 12px', outline: 'none', background: 'transparent', border: 'none', fontFamily: 'IBM Plex Mono, monospace', fontSize: '15px', color: '#1C2B27' }}
        />
        {suffix && <span style={{ paddingRight: 12, paddingLeft: 4, fontSize: 14, color: '#5C6B65' }}>{suffix}</span>}
      </div>
    </label>
  );
}

function InfoPopover({ children }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onClick = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, [open]);

  return (
    <span ref={ref} style={{ position: 'relative', display: 'inline-block' }}>
      <button
        type="button"
        onClick={() => setOpen((v) => !v)}
        aria-label="More info"
        style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%',
          width: '16px', height: '16px', fontSize: '11px', lineHeight: 1, fontWeight: 500,
          background: open ? '#164B44' : '#D3DBD4', color: open ? '#FFFFFF' : '#5C6B65',
          marginLeft: '6px', cursor: 'pointer', border: 'none',
        }}
      >
        i
      </button>
      {open && (
        <div
          style={{
            position: 'absolute', top: '22px', left: 0, zIndex: 20, width: '260px',
            borderRadius: '10px', padding: '12px', background: '#FFFFFF',
            border: '1px solid #D3DBD4', boxShadow: '0 4px 16px rgba(28,43,39,0.12)',
          }}
        >
          {children}
        </div>
      )}
    </span>
  );
}

function ProjectionChart({ points, retirementAge }) {
  const width = 560, height = 220, padL = 48, padR = 12, padT = 12, padB = 24;
  const innerW = width - padL - padR, innerH = height - padT - padB;

  const ages = points.map((p) => p.age);
  const totals = points.map((p) => Math.max(0, p.total));
  const minAge = Math.min(...ages), maxAge = Math.max(...ages);
  const maxTotal = Math.max(...totals, 1);

  const x = (age) => padL + ((age - minAge) / Math.max(1, maxAge - minAge)) * innerW;
  const y = (val) => padT + innerH - (val / maxTotal) * innerH;

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(p.age)} ${y(Math.max(0, p.total))}`).join(' ');
  const areaPath = `${linePath} L ${x(points[points.length - 1].age)} ${y(0)} L ${x(points[0].age)} ${y(0)} Z`;

  const retX = x(retirementAge);
  const yTicks = [0, maxTotal * 0.5, maxTotal].map((v) => Math.round(v));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
      <defs>
        <linearGradient id="growth" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#164B44" stopOpacity="0.5" />
          <stop offset="100%" stopColor="#164B44" stopOpacity="0.03" />
        </linearGradient>
      </defs>
      {yTicks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={width - padR} y1={y(t)} y2={y(t)} stroke="#E4E9E3" strokeDasharray="3 3" />
          <text x={4} y={y(t) + 4} fontSize="10" fill="#8A9B92">{fmtCompact(t)}</text>
        </g>
      ))}
      <line x1={retX} x2={retX} y1={padT} y2={height - padB} stroke="#C99A3C" strokeDasharray="4 2" />
      <text x={retX + 4} y={padT + 10} fontSize="10" fill="#C99A3C">Retire</text>
      <path d={areaPath} fill="url(#growth)" />
      <path d={linePath} fill="none" stroke="#164B44" strokeWidth="2" />
      <text x={padL} y={height - 6} fontSize="10" fill="#8A9B92">Age {minAge}</text>
      <text x={width - padR} y={height - 6} fontSize="10" fill="#8A9B92" textAnchor="end">Age {maxAge}</text>
    </svg>
  );
}

function RetirementPlanner() {
  const [data, setData] = useState(DEFAULTS);
  const [step, setStep] = useState(1);
  const [formOpen, setFormOpen] = useState(true);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState('idle');
  const saveTimer = useRef(null);

  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) setData({ ...DEFAULTS, ...JSON.parse(raw) });
    } catch (e) {
      // no saved plan yet
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveState('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        setSaveState('saved');
      } catch (e) {
        setSaveState('error');
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [data, loaded]);

  const update = (key) => (val) => setData((d) => ({ ...d, [key]: val }));
  const proj = computeProjection(data);
  const isSurplus = proj.gap >= 0;

  if (!loaded) {
    return <div style={{ padding: '2rem', color: '#5C6B65' }}>Loading your plan…</div>;
  }

  return (
    <div style={{ maxWidth: '1024px', margin: '0 auto', padding: '32px 20px' }}>
      <div style={{ marginBottom: '28px' }}>
        <p style={{ fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.08em', color: '#8A9B92', margin: '0 0 4px' }}>
          Retirement runway
        </p>
        <h1 style={{ fontFamily: 'Fraunces, Georgia, serif', fontSize: '30px', fontWeight: 600, color: '#164B44', margin: 0 }}>
          Will your EPF carry you through retirement?
        </h1>
        <p style={{ fontSize: '14px', color: '#5C6B65', marginTop: '6px' }}>
          Four numbers in, one honest answer out. Your plan saves automatically on this device.
        </p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth >= 1024 ? '2fr 3fr' : '1fr', gap: '24px' }}>
        <div>
          <div style={{ display: 'flex', flexDirection: window.innerWidth >= 1024 ? 'column' : 'row', gap: '8px', marginBottom: window.innerWidth >= 1024 ? 0 : '16px', flexWrap: 'wrap' }}>
            {STEPS.map((s) => (
              <button
                key={s.id}
                onClick={() => { setStep(s.id); setFormOpen(true); }}
                style={{
                  flex: window.innerWidth >= 1024 ? 'none' : '1 1 auto',
                  textAlign: 'left', padding: '12px 16px', borderRadius: '10px', cursor: 'pointer',
                  background: step === s.id ? '#164B44' : '#FFFFFF',
                  border: step === s.id ? '1px solid #164B44' : '1px solid #D3DBD4',
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%',
                    width: '22px', height: '22px', fontSize: '12px', fontWeight: 500, flexShrink: 0,
                    background: step === s.id ? '#C99A3C' : '#EDF2ED', color: step === s.id ? '#1C2B27' : '#5C6B65',
                  }}>{s.id}</span>
                  <div>
                    <div style={{ fontSize: '14px', fontWeight: 500, color: step === s.id ? '#FFFFFF' : '#1C2B27' }}>{s.label}</div>
                    <div style={{ fontSize: '12px', color: step === s.id ? '#CFE0DB' : '#8A9B92' }}>{s.hint}</div>
                  </div>
                </div>
              </button>
            ))}
          </div>

          {formOpen && (
          <div style={{ borderRadius: '14px', padding: '20px', marginTop: '8px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
            {step === 1 && (
              <>
                <NumberField label="Current age" suffix="years" value={data.currentAge} onChange={update('currentAge')} min={16} max={80} />
                <NumberField label="Target retirement age" suffix="years" value={data.retirementAge} onChange={update('retirementAge')} min={data.currentAge + 1} max={90} />
                <NumberField label="Plan until age" suffix="years" value={data.lifeExpectancy} onChange={update('lifeExpectancy')} min={data.retirementAge + 1} max={110} />
              </>
            )}
            {step === 2 && (
              <>
                <NumberField label="Current EPF balance" prefix="RM" value={data.epfBalance} onChange={update('epfBalance')} step={500} />
                <NumberField label="Monthly salary" prefix="RM" value={data.monthlySalary} onChange={update('monthlySalary')} step={100} />
                <NumberField
                  label="Yearly salary increment"
                  suffix="% / year"
                  value={data.salaryIncrement}
                  onChange={update('salaryIncrement')}
                  step={0.5}
                  max={20}
                  info={
                    <p style={{ fontSize: '12px', margin: 0, color: '#1C2B27', lineHeight: 1.5 }}>
                      How much your salary rises each year on average, from raises and
                      promotions. Your EPF contributions grow with it, because they are a
                      percentage of salary. Use 0 if you expect no raises.
                    </p>
                  }
                />
                <NumberField
                  label="Employee contribution"
                  suffix="% of salary"
                  value={data.epfEmployeeRate}
                  onChange={update('epfEmployeeRate')}
                  step={0.5}
                  max={40}
                  info={
                    <p style={{ fontSize: '12px', margin: 0, color: '#1C2B27', lineHeight: 1.5 }}>
                      Statutory rate is 11% for employees under 60 (0–5.5% for 60+).
                      This is deducted directly from your salary.
                    </p>
                  }
                />
                <NumberField
                  label="Employer contribution"
                  suffix="% of salary"
                  value={data.epfEmployerRate}
                  onChange={update('epfEmployerRate')}
                  step={0.5}
                  max={40}
                  info={
                    <p style={{ fontSize: '12px', margin: 0, color: '#1C2B27', lineHeight: 1.5 }}>
                      Statutory rate (Third Schedule) is 13% if your wage is RM5,000
                      or below, and 12% above RM5,000 — for employees under 60.
                    </p>
                  }
                />
                <NumberField
                  label="Voluntary contribution"
                  prefix="RM"
                  suffix="/ month"
                  value={data.epfVoluntary}
                  onChange={update('epfVoluntary')}
                  step={50}
                  info={
                    <p style={{ fontSize: '12px', margin: 0, color: '#1C2B27', lineHeight: 1.5 }}>
                      Extra top-ups beyond the mandatory rate — e.g. via i-Saraan or
                      self-contribution. Leave at 0 if you're not topping up.
                    </p>
                  }
                />
                <NumberField
                  label="Expected EPF dividend"
                  suffix="% / year"
                  value={data.epfDividendRate}
                  onChange={update('epfDividendRate')}
                  step={0.1}
                  max={15}
                  info={
                    <div>
                      <p style={{ fontSize: '12px', margin: '0 0 8px', color: '#1C2B27', lineHeight: 1.5 }}>
                        EPF dividends have ranged 5.2%–6.9% since 2017, averaging around 5.8%,
                        with a legal 2.5% minimum floor. Past performance doesn't guarantee future rates.
                      </p>
                      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                        <tbody>
                          {EPF_DIVIDEND_HISTORY.map((row) => (
                            <tr key={row.year} style={{ borderTop: '1px solid #EDF2ED' }}>
                              <td style={{ padding: '4px 0', fontSize: '12px', color: '#5C6B65' }}>{row.year}</td>
                              <td style={{ padding: '4px 0', fontSize: '12px', textAlign: 'right', color: '#1C2B27', fontFamily: 'IBM Plex Mono, monospace' }}>{row.rate.toFixed(2)}%</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <p style={{ fontSize: '11px', marginTop: '8px', marginBottom: 0, color: '#8A9B92' }}>Source: KWSP investment highlights (Simpanan Konvensional).</p>
                    </div>
                  }
                />
              </>
            )}
            {step === 3 && (
              <>
                <NumberField label="Current other savings" prefix="RM" value={data.otherSavings} onChange={update('otherSavings')} step={500} />
                <NumberField label="Monthly contribution" prefix="RM" value={data.monthlyOtherSavings} onChange={update('monthlyOtherSavings')} step={50} />
                <NumberField
                  label="Expected return"
                  suffix="% / year"
                  value={data.otherReturnRate}
                  onChange={update('otherReturnRate')}
                  step={0.5}
                  max={20}
                  info={
                    <div>
                      <p style={{ fontSize: '12px', margin: '0 0 8px', color: '#1C2B27', lineHeight: 1.5 }}>
                        A rough gauge of what different low-to-moderate risk options in
                        Malaysia have recently paid, to help you pick a realistic number:
                      </p>
                      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                        <tbody>
                          <tr style={{ borderTop: '1px solid #EDF2ED' }}>
                            <td style={{ padding: '4px 0', fontSize: '12px', color: '#5C6B65' }}>Fixed deposit (12-mth)</td>
                            <td style={{ padding: '4px 0', fontSize: '12px', textAlign: 'right', color: '#1C2B27', fontFamily: 'IBM Plex Mono, monospace' }}>~2.5–3.5%</td>
                          </tr>
                          <tr style={{ borderTop: '1px solid #EDF2ED' }}>
                            <td style={{ padding: '4px 0', fontSize: '12px', color: '#5C6B65' }}>Amanah Saham Malaysia (ASM)</td>
                            <td style={{ padding: '4px 0', fontSize: '12px', textAlign: 'right', color: '#1C2B27', fontFamily: 'IBM Plex Mono, monospace' }}>~5.0%</td>
                          </tr>
                          <tr style={{ borderTop: '1px solid #EDF2ED' }}>
                            <td style={{ padding: '4px 0', fontSize: '12px', color: '#5C6B65' }}>Amanah Saham Bumiputera (ASB)</td>
                            <td style={{ padding: '4px 0', fontSize: '12px', textAlign: 'right', color: '#1C2B27', fontFamily: 'IBM Plex Mono, monospace' }}>~5.75%</td>
                          </tr>
                        </tbody>
                      </table>
                      <p style={{ fontSize: '11px', marginTop: '8px', marginBottom: 0, color: '#8A9B92' }}>
                        2025 declared/board rates — vary by year and provider, not guaranteed.
                      </p>
                    </div>
                  }
                />
              </>
            )}
            {step === 4 && (
              <>
                <NumberField label="Current monthly expenses" prefix="RM" value={data.monthlyExpenses} onChange={update('monthlyExpenses')} step={100} />
                <NumberField
                  label="Spending in retirement"
                  suffix="% of what you spend now"
                  value={data.retirementExpenseRatio}
                  onChange={update('retirementExpenseRatio')}
                  step={5}
                  max={150}
                  info={
                    <p style={{ fontSize: '12px', margin: 0, color: '#1C2B27', lineHeight: 1.5 }}>
                      Most people spend a bit less once retired — no commute, no work
                      clothes, maybe the mortgage is paid off. 70% means: if you spend
                      RM4,000/month now, plan for about RM2,800/month in retirement.
                      Set it higher if you expect a similar or pricier lifestyle.
                    </p>
                  }
                />
                <NumberField label="Inflation" suffix="% / year" value={data.inflationRate} onChange={update('inflationRate')} step={0.1} max={10} />
              </>
            )}

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '8px', paddingTop: '12px', borderTop: '1px solid #EDF2ED' }}>
              <button
                onClick={() => setStep((s) => Math.max(1, s - 1))}
                disabled={step === 1}
                style={{ fontSize: '14px', padding: '6px 12px', borderRadius: '8px', border: 'none', background: 'transparent', color: step === 1 ? '#B7C2BC' : '#164B44', cursor: step === 1 ? 'default' : 'pointer' }}
              >
                Back
              </button>
              <span style={{ fontSize: '12px', color: '#B7C2BC' }}>
                {saveState === 'saving' ? 'Saving…' : saveState === 'saved' ? 'Saved' : ''}
              </span>
              <button
                onClick={() => (step === 4 ? setFormOpen(false) : setStep((s) => Math.min(4, s + 1)))}
                style={{ fontSize: '14px', padding: '6px 12px', borderRadius: '8px', border: 'none', fontWeight: 500, color: '#FFFFFF', background: '#164B44', cursor: 'pointer' }}
              >
                {step === 4 ? 'Finish' : 'Next'}
              </button>
            </div>
          </div>
          )}
        </div>

        <div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '16px' }}>
            <div style={{ borderRadius: '14px', padding: '16px', background: '#164B44' }}>
              <div style={{ fontSize: '12px', marginBottom: '4px', color: '#9FC3BA' }}>Projected pot at {data.retirementAge}</div>
              <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '22px', fontWeight: 500, color: '#FFFFFF' }}>{fmtCompact(proj.totalAtRetirement)}</div>
            </div>
            <div style={{ borderRadius: '14px', padding: '16px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
              <div style={{ fontSize: '12px', marginBottom: '4px', color: '#8A9B92' }}>Needed through age {data.lifeExpectancy}</div>
              <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '22px', fontWeight: 500, color: '#1C2B27' }}>{fmtCompact(proj.requiredPot)}</div>
            </div>
          </div>

          <div style={{ borderRadius: '14px', padding: '16px', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '12px', background: isSurplus ? '#EAF3DE' : '#FAECE7', border: `1px solid ${isSurplus ? '#C0DD97' : '#F0997B'}` }}>
            <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '15px', fontWeight: 500, color: isSurplus ? '#27500A' : '#712B13' }}>
              {isSurplus ? '+' : ''}{fmtCompact(proj.gap)}
            </div>
            <div style={{ fontSize: '14px', color: isSurplus ? '#3B6D11' : '#993C1D' }}>
              {isSurplus
                ? "On current numbers, you're on track with room to spare."
                : proj.runOutAge
                ? `On current numbers, savings may run out around age ${proj.runOutAge}.`
                : "On current numbers, you're short of what retirement will need."}
            </div>
          </div>

          <div style={{ borderRadius: '14px', padding: '16px', marginBottom: '16px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
            <div style={{ fontSize: '12px', marginBottom: '8px', color: '#8A9B92' }}>Balance over time — still earning returns through retirement, not just the savings years</div>
            <ProjectionChart points={proj.points} retirementAge={data.retirementAge} />
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <div style={{ borderRadius: '14px', padding: '16px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
              <div style={{ fontSize: '12px', marginBottom: '4px', color: '#8A9B92' }}>EPF at retirement</div>
              <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '16px', color: '#1C2B27' }}>{fmtCompact(proj.epfAtRetirement)}</div>
            </div>
            <div style={{ borderRadius: '14px', padding: '16px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
              <div style={{ fontSize: '12px', marginBottom: '4px', color: '#8A9B92' }}>Other savings at retirement</div>
              <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '16px', color: '#1C2B27' }}>{fmtCompact(proj.otherAtRetirement)}</div>
            </div>
            <div style={{ borderRadius: '14px', padding: '16px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
              <div style={{ fontSize: '12px', marginBottom: '4px', color: '#8A9B92', display: 'flex', alignItems: 'center' }}>
                Monthly spend at retirement
                <InfoPopover>
                  <p style={{ fontSize: '12px', margin: 0, color: '#1C2B27', lineHeight: 1.5 }}>
                    This includes inflation. It starts from today's spending, scaled to{' '}
                    {data.retirementExpenseRatio}% for retirement, then raised by {data.inflationRate}% a
                    year until you retire at {data.retirementAge}. It shows what you'd spend
                    per month in your first year of retirement, in future ringgit. It keeps
                    rising with inflation every year after that.
                  </p>
                </InfoPopover>
              </div>
              <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '16px', color: '#1C2B27' }}>{fmtCompact(proj.monthlyExpenseAtRetirement)}</div>
            </div>
            <div style={{ borderRadius: '14px', padding: '16px', background: '#FFFFFF', border: '1px solid #D3DBD4' }}>
              <div style={{ fontSize: '12px', marginBottom: '4px', color: '#8A9B92' }}>Years in retirement</div>
              <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: '16px', color: '#1C2B27' }}>{proj.yearsInRetirement} years</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [, force] = useState(0);
  useEffect(() => {
    const onResize = () => force((n) => n + 1);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return <div style={{ minHeight: '100vh', background: '#EDF2ED' }}><RetirementPlanner /></div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  // Manually transform the JSX source using the classic runtime (React.createElement),
  // since the automatic runtime needs a bundler and fails silently in a plain script tag.
  (function () {
    var source = document.getElementById('app-source').textContent;
    try {
      var compiled = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]],
      }).code;
      var script = document.createElement('script');
      script.textContent = compiled;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<pre style="padding:20px;color:#712B13;white-space:pre-wrap;">Failed to start: ' +
        (err && err.message ? err.message : err) + '</pre>';
    }
  })();
</script>
</body>
</html>
