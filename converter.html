<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Convert — Metric &amp; Imperial</title>
<style>
:root{
  --bg1:#EDF2ED; --bg2:#DDE9E0; --bg3:#F5F9F5;
  --glass:rgba(255,255,255,0.78); --glass-b:rgba(211,219,212,0.9);
  --text:#1C2B27; --dim:#5C6B65; --accent:#164B44; --accent2:#0F3A34; --on-accent:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --bg1:#0C1815; --bg2:#12302A; --bg3:#0F231F;
  --glass:rgba(22,48,43,0.6); --glass-b:rgba(60,96,88,0.55);
  --text:#E6F0EA; --dim:#9DB5AC; --accent:#8FD6C4; --accent2:#6CC4AF; --on-accent:#0E1B18;
}}
:root[data-theme="dark"]{
  --bg1:#0C1815; --bg2:#12302A; --bg3:#0F231F;
  --glass:rgba(22,48,43,0.6); --glass-b:rgba(60,96,88,0.55);
  --text:#E6F0EA; --dim:#9DB5AC; --accent:#8FD6C4; --accent2:#6CC4AF; --on-accent:#0E1B18;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--sans); color:var(--text);
  background:radial-gradient(circle at 15% 10%,var(--bg2),transparent 45%),
             radial-gradient(circle at 85% 20%,var(--bg3),transparent 45%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100%;
  padding:max(18px,env(safe-area-inset-top,0px)) 14px max(24px,env(safe-area-inset-bottom,0px));
}
.wrap{max-width:480px;margin:0 auto;}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
.topbar h1{font-size:17px;margin:0;flex:1;font-weight:750;}
.iconbtn{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);
  border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--text);font-size:15px;}
.iconbtn:focus-visible{outline:2px solid var(--accent);}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--glass-b);
  background:var(--glass);backdrop-filter:blur(14px);color:var(--text);font-size:14px;margin-bottom:10px;}
.search::placeholder{color:var(--dim);}
.searchResults{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-b);
  border-radius:12px;margin:-4px 0 10px;overflow:hidden;display:none;}
.searchResults div{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--glass-b);}
.searchResults div:last-child{border-bottom:none;}
.searchResults div:hover{color:var(--accent);}
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.cat{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--glass-b);
  background:var(--glass);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.cat.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.favs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;}
.fav{flex:none;padding:6px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);
  font-size:12px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:6px;}
.fav button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;padding:0;}
.card{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);
  border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(22,75,68,0.12);margin-bottom:14px;}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.row input[type=text]{flex:1;font-family:var(--mono);font-size:22px;font-weight:700;
  background:transparent;border:none;color:var(--text);width:0;}
.row input[type=text]:focus{outline:none;}
select{font-family:var(--sans);font-size:13px;font-weight:650;background:var(--glass-b);
  border:none;border-radius:9px;padding:8px 8px;color:var(--text);cursor:pointer;max-width:110px;}
.copybtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:4px;}
.copybtn:hover{color:var(--accent);}
.swaprow{display:flex;justify-content:center;margin:-2px 0 6px;}
.swapbtn{background:var(--accent2);color:var(--on-accent);border:none;width:34px;height:34px;border-radius:50%;
  cursor:pointer;font-size:15px;box-shadow:0 4px 10px rgba(22,75,68,0.35);}
.starbtn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1;}
.starbtn span{font-size:9.5px;font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.starbtn.on{color:var(--text); font-weight:700;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--dim);
  margin:0 0 8px 2px;font-weight:700;}
.hist{background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:6px 4px;}
.histrow{display:flex;justify-content:space-between;padding:9px 12px;font-size:12.5px;
  border-bottom:1px dashed var(--glass-b);cursor:pointer;}
.histrow:last-child{border-bottom:none;}
.histrow .t{color:var(--dim);font-size:10.5px;}
.empty{padding:14px;text-align:center;color:var(--dim);font-size:12.5px;}
.footnote{text-align:center;font-size:11px;color:var(--dim);margin-top:16px;line-height:1.6;}
.footnote a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="iconbtn" href="index.html" title="All calculators" style="text-decoration:none;font-size:13px;white-space:nowrap">&larr; All</a>
    <h1>Convert</h1>
    <button class="iconbtn" id="themeBtn" title="Toggle theme">🌗</button>
  </div>
  <input class="search" id="search" placeholder="Search units (e.g. cup, psi, kWh)…" />
  <div class="searchResults" id="searchResults"></div>
  <div class="cats" id="cats"></div>
  <div class="favs" id="favs"></div>

  <div class="card">
    <div class="row">
      <select id="fromUnit"></select>
      <input type="text" id="fromVal" inputmode="decimal" value="1" />
      <button class="copybtn" data-copy="fromVal" title="Copy">⧉</button>
    </div>
    <div class="swaprow"><button class="swapbtn" id="swapBtn" title="Swap">⇅</button></div>
    <div class="row">
      <select id="toUnit"></select>
      <input type="text" id="toVal" inputmode="decimal" readonly />
      <button class="copybtn" data-copy="toVal" title="Copy">⧉</button>
      <button class="starbtn" id="starBtn" title="Pin this pair">★<span>Pin this pair</span></button>
    </div>
  </div>

  <div class="section-title">Recent</div>
  <div class="hist" id="hist"></div>

  <div class="footnote">
    All conversions run locally on your device — works fully offline, no accounts, no tracking.<br/>
    Missing a unit? <a href="#" id="suggestLink">Suggest one</a>.
  </div>
</div>

<script>
(function(){
  const CATS = {
    length:{label:'Length', base:'m', units:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.34,yd:0.9144,ft:0.3048,in:0.0254,nmi:1852}},
    weight:{label:'Weight', base:'kg', units:{kg:1,g:0.001,mg:0.000001,t:1000,lb:0.453592,oz:0.0283495,st:6.35029}},
    volume:{label:'Volume', base:'l', units:{l:1,ml:0.001,m3:1000,gal:3.78541,qt:0.946353,pt:0.473176,cup:0.24,floz:0.0295735,tbsp:0.0147868,tsp:0.00492892}},
    temperature:{label:'Temp', special:true, units:{C:'C',F:'F',K:'K'}},
    data:{label:'Data', base:'B', units:{b:0.125,B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776,Kb:16,Mb:16384,Gb:16777216}},
    energy:{label:'Energy', base:'J', units:{J:1,kJ:1000,cal:4.184,kcal:4184,Wh:3600,kWh:3600000,BTU:1055.06}},
    pressure:{label:'Pressure', base:'Pa', units:{Pa:1,kPa:1000,bar:100000,atm:101325,psi:6894.76,mmHg:133.322}},
    angle:{label:'Angle', base:'deg', units:{deg:1,rad:57.2958,grad:0.9,arcmin:1/60,arcsec:1/3600}},
  };
  const catsEl=document.getElementById('cats'), favsEl=document.getElementById('favs'), histEl=document.getElementById('hist');
  const fromUnitEl=document.getElementById('fromUnit'), toUnitEl=document.getElementById('toUnit');
  const fromValEl=document.getElementById('fromVal'), toValEl=document.getElementById('toVal');
  const searchEl=document.getElementById('search'), searchResultsEl=document.getElementById('searchResults');
  const starBtn=document.getElementById('starBtn');

  let activeCat='length', favs=[], hist=[];
  const LS='convert-app-v1';

  function load(){ try{ const d=JSON.parse(localStorage.getItem(LS)||'{}'); favs=d.favs||[]; hist=d.hist||[]; activeCat=d.activeCat||'length'; }catch(e){} }
  function save(){ try{ localStorage.setItem(LS, JSON.stringify({favs,hist,activeCat})); }catch(e){} }

  function tempToC(v,u){ return u==='C'?v : u==='F'?(v-32)*5/9 : v-273.15; }
  function cFromC(v,u){ return u==='C'?v : u==='F'?v*9/5+32 : v+273.15; }

  function convert(cat,val,from,to){
    const c=CATS[cat];
    if(c.special) return cFromC(tempToC(val,from),to);
    return val * c.units[from] / c.units[to];
  }
  function fmt(n){
    if(!isFinite(n)) return '';
    const r=Math.round(n*1e6)/1e6;
    return r.toLocaleString(undefined,{maximumFractionDigits:6});
  }

  function renderCats(){
    catsEl.innerHTML='';
    Object.keys(CATS).forEach(k=>{
      const b=document.createElement('button');
      b.className='cat'+(k===activeCat?' active':'');
      b.textContent=CATS[k].label;
      b.onclick=()=>{ activeCat=k; save(); setupUnits(); renderFavs(); doConvert(); };
      catsEl.appendChild(b);
    });
  }
  function setupUnits(){
    renderCats();
    const units=Object.keys(CATS[activeCat].units);
    [fromUnitEl,toUnitEl].forEach((sel,i)=>{
      sel.innerHTML='';
      units.forEach(u=>{ const o=document.createElement('option'); o.value=u; o.textContent=u; sel.appendChild(o); });
      sel.value = i===0? units[0] : units[1]||units[0];
    });
    updateStar();
  }
  function doConvert(){
    const val=parseFloat(fromValEl.value);
    if(isNaN(val)){ toValEl.value=''; return; }
    toValEl.value = fmt(convert(activeCat,val,fromUnitEl.value,toUnitEl.value));
    updateStar();
  }
  function pushHistory(){
    const val=parseFloat(fromValEl.value);
    if(isNaN(val)||toValEl.value==='') return;
    hist.unshift({cat:activeCat, from:fromUnitEl.value, to:toUnitEl.value, val:fromValEl.value, res:toValEl.value, t:new Date().toLocaleTimeString()});
    hist=hist.slice(0,10); save(); renderHist();
  }
  function renderHist(){
    histEl.innerHTML='';
    if(hist.length===0){ histEl.innerHTML='<div class="empty">No conversions yet</div>'; return; }
    hist.forEach(h=>{
      const row=document.createElement('div'); row.className='histrow';
      row.innerHTML=`<span>${h.val} ${h.from} → ${h.res} ${h.to}</span><span class="t">${h.t}</span>`;
      row.onclick=()=>{ activeCat=h.cat; save(); setupUnits(); fromUnitEl.value=h.from; toUnitEl.value=h.to; fromValEl.value=h.val; doConvert(); };
      histEl.appendChild(row);
    });
  }
  function favKey(){ return activeCat+':'+fromUnitEl.value+':'+toUnitEl.value; }
  function updateStar(){ starBtn.classList.toggle('on', favs.some(f=>f.key===favKey())); }
  function renderFavs(){
    favsEl.innerHTML='';
    favs.forEach(f=>{
      const chip=document.createElement('div'); chip.className='fav';
      chip.innerHTML=`<span>${f.from}→${f.to}</span>`;
      chip.onclick=()=>{ activeCat=f.cat; save(); setupUnits(); fromUnitEl.value=f.from; toUnitEl.value=f.to; doConvert(); };
      const x=document.createElement('button'); x.textContent='✕';
      x.onclick=(e)=>{ e.stopPropagation(); favs=favs.filter(x=>x.key!==f.key); save(); renderFavs(); updateStar(); };
      chip.appendChild(x);
      favsEl.appendChild(chip);
    });
  }
  starBtn.onclick=()=>{
    const key=favKey();
    if(favs.some(f=>f.key===key)){ favs=favs.filter(f=>f.key!==key); }
    else{ favs.unshift({key,cat:activeCat,from:fromUnitEl.value,to:toUnitEl.value}); favs=favs.slice(0,8); }
    save(); renderFavs(); updateStar();
  };

  fromValEl.addEventListener('input', doConvert);
  fromUnitEl.addEventListener('change', doConvert);
  toUnitEl.addEventListener('change', doConvert);
  fromValEl.addEventListener('change', pushHistory);
  document.getElementById('swapBtn').onclick=()=>{
    const a=fromUnitEl.value; fromUnitEl.value=toUnitEl.value; toUnitEl.value=a;
    const fv=fromValEl.value; fromValEl.value=toValEl.value||fv; doConvert();
  };
  document.querySelectorAll('.copybtn').forEach(b=>{
    b.onclick=()=>{ const el=document.getElementById(b.dataset.copy);
      navigator.clipboard?.writeText(el.value).then(()=>{ b.textContent='✓'; setTimeout(()=>b.textContent='⧉',900); }); };
  });

  const flat=[];
  Object.entries(CATS).forEach(([k,c])=>Object.keys(c.units).forEach(u=>flat.push({cat:k,unit:u})));
  searchEl.addEventListener('input',()=>{
    const q=searchEl.value.trim().toLowerCase();
    if(!q){ searchResultsEl.style.display='none'; return; }
    const matches=flat.filter(f=>f.unit.toLowerCase().includes(q)).slice(0,6);
    searchResultsEl.innerHTML='';
    if(matches.length===0){ searchResultsEl.style.display='none'; return; }
    matches.forEach(m=>{
      const d=document.createElement('div');
      d.textContent=`${m.unit} — ${CATS[m.cat].label}`;
      d.onclick=()=>{ activeCat=m.cat; save(); setupUnits(); toUnitEl.value=m.unit; doConvert();
        searchEl.value=''; searchResultsEl.style.display='none'; };
      searchResultsEl.appendChild(d);
    });
    searchResultsEl.style.display='block';
  });

  const themeBtn=document.getElementById('themeBtn');
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t); try{localStorage.setItem('convert-theme',t);}catch(e){} }
  themeBtn.onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    setTheme(cur==='dark'?'light':'dark');
  };
  try{ const saved=localStorage.getItem('convert-theme'); if(saved) setTheme(saved); }catch(e){}

  document.getElementById('suggestLink').onclick=(e)=>{
    e.preventDefault();
    window.location.href='mailto:?subject=Unit%20request%20for%20Convert&body=Category%20or%20unit%20I%27d%20like%20added:%20';
  };

  load();
  setupUnits();
  renderFavs();
  renderHist();
  doConvert();
})();
</script>
</body>
</html>
